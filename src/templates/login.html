<!DOCTYPE html>
<html>
<head>
    <title>SIGR - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4 shadow" style="width: 300px;">
        <h3 class="text-center mb-3">Restaurante SIGR</h3>
        <form action="/login" method="POST">
            <input type="text" name="username" class="form-control mb-2" placeholder="Usuario (admin/mesero)" required>
            <input type="password" name="password" class="form-control mb-2" placeholder="Contraseña (1234)" required>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="alert alert-danger mt-2">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
    </div>
</body>
</html>
